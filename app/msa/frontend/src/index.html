<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="계절을 담은 꽃다발과 일상에 두고 싶은 식물, Solflower.">
  <title>Solflower · 꽃이 필요한 모든 순간</title>
  <link rel="stylesheet" href="/assets/style.css?v=soldesk-v1">
  <link rel="stylesheet" href="/assets/solflower.css?v=1">
</head>
<body class="store-home">
  <header class="header">
    <div class="container storefront-nav">
      <a class="brand" href="/" aria-label="Solflower 홈">Solflower</a>
      <nav class="shop-categories" aria-label="상품 탐색">
        <a href="/#productSection" data-category="">전체 상품</a>
        <a href="/?category=bouquets#productSection" data-category="bouquets">꽃다발</a>
        <a href="/?category=gifts#productSection" data-category="gifts">플라워 기프트</a>
        <a href="/?category=plants#productSection" data-category="plants">반려식물</a>
      </nav>
      <nav class="nav" aria-label="회원 메뉴">
        <a class="btn btn-light" data-guest-only href="/login.html">로그인</a>
        <a class="btn btn-light" data-guest-only href="/signup.html">회원가입</a>
        <a class="btn btn-primary" data-admin-only style="display:none" href="/product-create.html">상품 등록</a>
        <div id="userBox"></div>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="storefront-hero" aria-labelledby="heroTitle">
      <img src="/assets/solflower-storefront.jpg" alt="햇살이 비치는 Solflower 꽃집" width="1672" height="941" fetchpriority="high">
      <div class="storefront-copy">
        <span class="storefront-kicker">SOLFLOWER STUDIO</span>
        <h1 id="heroTitle">꽃이 필요한<br>모든 순간.</h1>
        <p>계절을 담은 꽃다발과 일상에 두고 싶은 식물.</p>
        <a class="storefront-cta" href="/#productSection">상품 둘러보기 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <section class="store-collection" id="productSection" aria-labelledby="collectionTitle">
      <div class="section-head">
        <div><h2 class="section-title" id="collectionTitle">지금 만나는 꽃</h2>
          <p class="section-sub">선물할 꽃부터 나를 위한 한 다발까지</p></div>
        <p class="section-sub" id="productCount" aria-live="polite">상품을 불러오는 중</p>
      </div>
      <div id="productList" class="grid" aria-live="polite"></div>
    </section>
  </main>
  <footer class="footer container"><span>Solflower</span><span>꽃다발 · 플라워 기프트 · 반려식물</span></footer>
  <script src="/assets/app.js?v=solflower-v2"></script>
  <script>
    renderHeader();
    const category = getQueryParam('category') || '';
    for (const link of document.querySelectorAll('[data-category]')) {
      if (link.dataset.category === category) link.setAttribute('aria-current', 'page');
    }
    loadProducts();
  </script>
</body>
</html>
