spring:
  config:
    activate:
      on-profile: prod
  application:
    name: member-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/ordermsa?sslMode=VERIFY_IDENTITY
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

jwt:
  expiration: 1000
  secretKey: ${JWT_SECRET}
  expirationRt: 288000
  secretKeyRt: ${JWT_REFRESH_SECRET}

# Prometheus가 HTTP 지표를 수집할 수 있도록 Actuator 엔드포인트 공개
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
