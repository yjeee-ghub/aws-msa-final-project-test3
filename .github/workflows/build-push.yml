name: Test and publish changed services
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' && format('Lab build {0}', inputs.request_id) || github.event.head_commit.message || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: '최초 재구축/게시 실패 복구용 전체 빌드 (AWS 게시는 main만)'
        type: boolean
        default: true
      publish_images:
        description: '실제 ECR 게시·main 배포 선언 반영 (최초 infra/ECR 준비 후 main에서만)'
        type: boolean
        default: false
      request_id:
        description: '설치 스크립트가 같은 빌드를 중복 실행하지 않도록 사용하는 식별자'
        type: string
        default: ''
  push:
    branches: [main, test, test2, "build2/**"]
permissions:
  contents: read
concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check shared environment and backend identity
        run: python3 scripts/ops/check_environment.py
      - name: CI, consumer and recovery regression tests
        run: python3 -m unittest discover -s tests -v
      - id: select
        env:
          BASE: ${{ github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: |
          if [ "$FULL" = true ]; then
            python3 scripts/ci/changed_services.py --all
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            python3 scripts/ci/changed_services.py --since-image-tags --head HEAD
          else
            python3 scripts/ci/changed_services.py --base "$BASE" --head HEAD
          fi
      - name: Validate release declaration
        env:
          BASE: ${{ github.event.before }}
        run: python3 scripts/ci/release_manifest.py validate --base "$BASE"
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Execute readiness provisioners locally (no AWS)
        run: python3 -m unittest discover -s tests -p test_local_exec.py -v
      - name: Terraform validate (no backend and no AWS authentication)
        run: |
          terraform fmt -check -recursive terraform terraform-k8s terraform-state-bootstrap
          for root in terraform-state-bootstrap terraform terraform-k8s; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
          terraform -chdir=terraform-k8s test -no-color
          terraform -chdir=terraform test -no-color
      - name: Render GitOps manifests
        run: kubectl kustomize app/msa > /tmp/apps.yaml
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - name: Validate database Secret chart
        run: >-
          helm lint terraform-k8s/charts/database-secret
          --set region=ap-northeast-2
          --set secretArn=arn:aws:secretsmanager:ap-northeast-2:683668078297:secret:mock
          --set roleArn=arn:aws:iam::683668078297:role/mock
  windows-readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - name: Execute both readiness provisioners on Windows (no AWS)
        run: python -m unittest discover -s tests -p test_local_exec.py -v
      - name: Validate PowerShell entry points and orchestration with fake APIs (no AWS)
        run: python -m unittest discover -s tests -p test_lab_automation.py -v
  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and package
        run: bash scripts/ci/test-service.sh '${{ matrix.service }}'
      - name: Build tested image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build --platform linux/amd64 -t local-check:$SERVICE app/msa/$SERVICE
      - name: Check frontend NGINX configuration
        if: matrix.service == 'frontend'
        run: docker run --rm --add-host apigateway-service:127.0.0.1 local-check:frontend nginx -t
      - name: Save exact image for publishing (main only)
        if: github.ref == 'refs/heads/main' && (vars.ENABLE_IMAGE_PUBLISH == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_images))
        env:
          SERVICE: ${{ matrix.service }}
        run: docker save local-check:$SERVICE | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (vars.ENABLE_IMAGE_PUBLISH == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_images))
        with:
          name: image-${{ matrix.service }}
          path: image.tar.gz
          retention-days: 2
  gate:
    name: required-ci
    if: always()
    needs: [changes, config, windows-readiness, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CONFIG: ${{ needs.config.result }}
          WINDOWS: ${{ needs.windows-readiness.result }}
          TEST: ${{ needs.test.result }}
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          test "$CHANGES" = success
          test "$CONFIG" = success
          test "$WINDOWS" = success
          if [ "$SERVICES" != '[]' ]; then test "$TEST" = success; fi
  publish:
    needs: [changes, test, gate]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success' && (vars.ENABLE_IMAGE_PUBLISH == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_images))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse stale source
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - id: environment
        run: |
          jq -r '"region=\(.region)\naccount=\(.account)"' scripts/ops/environment.json >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ steps.environment.outputs.region }}
          allowed-account-ids: ${{ steps.environment.outputs.account }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - name: Publish tested artifacts
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
        run: python3 scripts/ci/release_manifest.py publish
      - name: Commit tested image digests to main
        id: deploy
        run: python3 scripts/ci/release_manifest.py deploy
  verify-deployment:
    needs: publish
    if: vars.ENABLE_DEPLOY_CHECKS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.request_id == '')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-check.yml
    with:
      revision: ${{ needs.publish.outputs.revision }}
